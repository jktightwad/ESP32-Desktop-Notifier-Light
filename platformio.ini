[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
monitor_filters = time   ; timestamp each serial line
upload_speed = 921600

;To update directly to the device, uncomment the following 2 lines and change the IP to the one for the device to be updated
;upload_protocol = espota
;upload_port = 192.168.1.87

; use our table with a real LittleFS partition
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D WM_NO_GLOBAL_DEBUG

lib_deps =
  tzapu/WiFiManager @ ^2.0.17
  adafruit/Adafruit NeoPixel @ ^1.12.0
  knolleary/PubSubClient @ ^2.8
  bblanchon/ArduinoJson @ ^7.0.4
  ayushsharma82/ElegantOTA @ ^3.1.5
